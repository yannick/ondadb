[package]
name = "ondadb"
version = "0.9.1"
edition = "2021"
rust-version = "1.89" # std::fs::File advisory locking (DB LOCK file)
license = "MPL-2.0"
description = "ondaDB — a safe, performance-focused Rust key/value LSM storage engine"
repository = "https://github.com/local/ondadb"

[lib]
name = "ondadb"
path = "src/lib.rs"

[[bin]]
name = "onda_bench"
path = "src/bin/onda_bench.rs"

[features]
default = []
# Object-store (S3) support pulls in network deps; gated so the core build stays lean.
s3 = ["dep:rust-s3", "dep:tokio"]
# Opt-in performance fast paths that use localized `unsafe`. The default build
# denies unsafe except for the audited Linux coarse-clock call; each fast-path
# feature additionally permits its documented implementation area.
# mmap'd zero-copy SSTable/vlog reads (helps point reads and SST-resident scans).
mmap-reads = ["dep:memmap2"]
# Arena-backed skip-list memtable (helps write/flush throughput). NOTE: its read
# iterator currently materializes a full sorted snapshot per iterator, so
# scan-heavy workloads should benchmark before enabling.
arena-memtable = []
# Back-compat alias: both fast paths.
unsafe-fastpath = ["mmap-reads", "arena-memtable"]

[dependencies]
crossbeam-skiplist = "0.1"
crossbeam-channel = "0.5"
# Safe self-referential struct: lets a read iterator own `Arc<Memtable>` and, in
# the same struct, hold `crossbeam_skiplist::Entry` cursors borrowing from inside
# it. Macro-only (no proc-macro), and its `unsafe` lives in its own crate.
self_cell = "1"
parking_lot = "0.12"
lru = "0.12"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
lz4_flex = "0.11"
zstd = "0.13"
snap = "1.1"
flate2 = "1.0"
rust-ini = "0.21"
sha2 = "0.10"
hmac = "0.12"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time"] }
memmap2 = { version = "0.9", optional = true }
smallvec = "1.15.2"
libc = "0.2.189"

# rust-s3's TLS backend is TARGET-CONDITIONAL:
#
#   * macOS: native-tls (Security.framework). rustls' native-roots loader
#     panics (`InvalidCertificate(BadEncoding)`) when the keychain holds a
#     cert it cannot parse — hit live on a macOS build host against a
#     plain-HTTP MinIO endpoint, where TLS should not even engage. The
#     platform stack tolerates its own store.
#   * everything else (Linux incl. musl): rustls. No system TLS library, so
#     static FROM-scratch container binaries link clean — the flavor spada's
#     musl CI images shipped all along. /etc/ssl/certs/ca-certificates.crt
#     must be present in the image for httpS endpoints (the CI packaging
#     copies it in).
#
# Same optional flag on both tables, so `s3 = ["dep:rust-s3", ...]` activates
# whichever table matches the target.
[target.'cfg(target_os = "macos")'.dependencies]
rust-s3 = { version = "0.35", optional = true, default-features = false, features = ["tags", "use-tokio-native-tls", "fail-on-err"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rust-s3 = { version = "0.35", optional = true, default-features = false, features = ["tags", "tokio-rustls-tls", "fail-on-err"] }

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
